name: flutter_app
description: "SmartBuy : Smart Budget et comparaison des prix."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Gestion d'état : Provider + ChangeNotifier (simple à expliquer, recommandé par l'équipe Flutter)
  provider: ^6.1.5
  # Navigation déclarative avec redirection selon la connexion
  go_router: ^17.5.0
  # Appels REST vers l'API Spring Boot
  http: ^1.6.0
  # Format des montants et des dates en français
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
